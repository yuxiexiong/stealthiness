<style>
:root{color-scheme:light;--ink:#192d37;--muted:#52636d;--line:#dce4e7;--accent:#116575}
html{scroll-behavior:smooth;scroll-padding-top:28px;background:#f5f7f8}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);line-height:1.9;font-size:17px;max-width:1000px;margin:36px 4vw 80px 310px;padding:44px 52px;background:white;border:1px solid var(--line);border-radius:12px;overflow-wrap:break-word}
body>header{display:none}h1{font-size:32px;line-height:1.5;letter-spacing:-.4px;margin-top:0}h2{font-size:25px;margin:66px 0 22px;border-top:2px solid var(--line);padding-top:28px;line-height:1.6}h3{font-size:20px;margin-top:32px;color:var(--accent);line-height:1.65}p{margin:16px 0}strong{font-weight:650}a{color:var(--accent);text-decoration:none;border-bottom:1px solid #b7d6dc}a:hover{color:#0a3f49;background:#edf5f6}blockquote{margin:22px 0;padding:10px 25px;background:#eff6f7;border-left:4px solid var(--accent);border-radius:0 8px 8px 0}blockquote p{margin:12px 0}ul,ol{padding-left:1.5em}li{margin:9px 0}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.8;margin:25px 0}th{text-align:left;background:#edf4f5;font-weight:650}td,th{padding:12px 14px;border:1px solid var(--line);vertical-align:top}tr:nth-child(even) td{background:#fafcfc}caption{font-size:14px;color:var(--muted)}code{font-size:.92em;background:#edf2f4;padding:2px 4px;border-radius:3px}pre{white-space:pre-wrap}
math{font-size:1.08em}math[display="block"]{display:block;overflow-x:auto;max-width:100%;padding:24px 16px;margin:22px 0;box-sizing:border-box;background:#f7f9fb;border:1px solid #e3e9ec;border-radius:8px;text-align:center;overflow-wrap:normal}#TOC{position:fixed;top:26px;left:22px;bottom:24px;width:249px;overflow:auto;font-size:14px;line-height:1.65;padding-right:12px}#TOC:before{content:"汇报导航 · 从问题到验证";display:block;font-size:15px;font-weight:700;color:var(--accent);margin:0 0 18px}#TOC ul{list-style:none;padding:0;margin:0}#TOC>ul>li>ul>li{margin:13px 0}#TOC>ul>li>a{font-weight:700}#TOC a{border:0;display:block}#TOC ul ul ul{display:none}
@media(max-width:1100px){body{margin:18px auto;padding:28px 24px;max-width:850px}#TOC{position:static;width:auto;margin:24px 0;padding:20px;background:#f5f8fa;border-radius:8px;max-height:340px}h1{font-size:27px}}
@media(max-width:600px){body{font-size:16px;padding:20px 16px;border:0;margin:0}h2{font-size:22px}table{display:block;overflow-x:auto;font-size:14px}td,th{min-width:100px;padding:10px}math[display="block"]{font-size:.93em}}
@media print{html{background:white}body{margin:0;padding:0;border:0;max-width:none;font-size:10.5pt;line-height:1.7}#TOC{display:none}h1{font-size:23pt}h2{font-size:16pt;margin-top:28pt;break-after:avoid}h3{font-size:12pt;break-after:avoid}table{font-size:9pt}tr,blockquote,math[display="block"]{break-inside:avoid}a{border:0;color:inherit}math[display="block"]{font-size:.9em;background:white}p{orphans:3;widows:3}}
</style>
